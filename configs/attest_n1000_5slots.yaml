# Mainnet-scale attestation run for the remote box (sukun@ethp2p): 1000 nodes, all
# 64 subnets active, K=70 peers/node, 1 MiB blocks, 5 slots. Same as attest_n1000.yaml
# but a longer run (5 slots) so more supernode proposers take a turn. Block dissemination
# + per-slot attestation coverage/no-leak at scale. Heavy — run with `simctl run --remote`.
topology:
  num_nodes: 1000
  degree: 70               # K: target peers per node
  type: random
  seed: 42
  super_node_fraction: 0.2 # 20% super nodes (1024/1024 Mbit); rest 25/50 — block proposers
  latency_multiple: 1.0
  min_node_to_node_latency_ms: 0

gossipsub:
  D: 8
  Dlow: 6
  Dhigh: 12

attestation:
  validators: 2000         # V
  committees: 64           # C = all 64 subnets active/slot
  committee_size: 8        # s_c (C*s_c = 512 <= V)
  subnet_count: 64
  subnets_per_node: 2      # ~2 subnets/node -> ~31 subscribers/subnet
  subscribe_floor: 10      # min subscribers per active subnet
  attestation_due_ms: 4000
  prep_ms: 0
  verify_delay_ms: 10
  per_item_ms: 0
  batch_window_ms: 50

num_slots: 5
slot_duration_seconds: 12
block_size: 1048576        # 1 MiB
verify_delay_ms: 10
offset_ms: 0
jitter_ms: 2000
startup_seconds: 150       # boot + dial + 0-30 s join stagger + settle
stop_time_minutes: 8       # 150 startup + 60 run + 30 drain = 240s, with margin
log_level: warning         # 1000 hosts: keep Shadow's own log small
seed: 1
