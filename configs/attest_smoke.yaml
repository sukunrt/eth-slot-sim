# Small local Shadow smoke run for the attestation phase: 15 nodes, 2 slots.
# After each block disseminates, attesters emit on their committee's subnet, voting
# block iff processed by ATTESTATION_DUE. Verify with analysis/check_arrivals.py:
# per-subnet coverage + no-leakage + the fraction-voted-block metric.
topology:
  num_nodes: 15
  degree: 8
  type: random
  seed: 42
  super_node_fraction: 0.1
  latency_multiple: 1.0
  min_node_to_node_latency_ms: 0

gossipsub:
  D: 8
  Dlow: 6
  Dhigh: 12

attestation:
  validators: 30        # V = 2*N
  committees: 2         # C active subnets/slot
  committee_size: 6     # s_c
  subnet_count: 64
  backbone_per_node: 1  # each node subscribes 1 of the 2 subnets → attesters on the other dial in
  subscribe_floor: 7    # min subscribers per active subnet
  attestation_due_ms: 4000   # ATTESTATION_DUE (3333 bp of a 12 s slot)
  prep_ms: 0
  verify_delay_ms: 10
  per_item_ms: 0
  batch_window_ms: 50

num_slots: 2
slot_duration_seconds: 12
block_size: 131072         # 128 KiB
verify_delay_ms: 10
offset_ms: 0
jitter_ms: 2000
startup_seconds: 60   # must exceed the 30 s mesh-join stagger
stop_time_minutes: 3
log_level: info
seed: 1
