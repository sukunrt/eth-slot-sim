# Decoupled consensus, small end-to-end example (the §10 shape, M6 sizing).
# Two chains on one fleet: the availability chain (block + data-column burst + a global flood of
# ac_vote_size VRF-selected validator votes, DA-gated) and the finality chain (every k AC slots,
# a per-validator vote on one of fs_subnets node-partitioned subnets, then fs_aggregators per subnet
# publish a population-scaled aggregate on a global topic at finality_slot_aggregation_fraction%).
# Attestations + sync are off (the AC vote stands in for the attestation). Data columns gate the AC
# vote. Measure a settled finality slot (1); the run spans k + k/2 + settle AC slots.
topology:
  num_nodes: 16
  degree: 6                # K: target peers per node
  type: random
  seed: 42
  super_node_fraction: 0.5 # the full-custody backbone is drawn from the supernodes

gossipsub:
  D: 8
  Dlow: 6
  Dhigh: 12

attestation:
  enabled: false           # OFF: this block only supplies V + the AC-vote deadline (attestation_due_ms)
  validators: 32           # V (>= N): every node validates ⇒ uniform custody
  committees: 1            # ignored under decoupled (no attestation committees)
  committee_size: 8        # ignored under decoupled
  attestation_due_ms: 4000 # the AC-vote deadline (reused; no new knob)

data_columns:
  enabled: true            # columns gate the AC vote (the "availability" chain)
  num_columns: 8
  blobs: 6
  custody_floor: 8
  full_custody_fraction: 0.5
  column_backbone_floor: 3
  verify_service_ms: 3
  verify_parallelism_super: 16
  verify_parallelism_regular: 4

decoupled_consensus:
  enabled: true
  ac_vote_size: 8                        # VRF-selected validators voting on the AC each slot (global topic)
  ac_slots_per_finality_slot: 2          # k
  fs_subnets: 2                          # finality subnets, node-partitioned (every node on one)
  fs_aggregators: 2                      # aggregators per finality subnet per finality slot
  finality_slot_aggregation_fraction: 50 # % of the finality slot when aggregates publish
  fc_vote_offset_ms: 1000                # offset into the finality slot for the vote burst

num_slots: 5
slot_duration_seconds: 12
block_size: 131072
verify_delay_ms: 10
offset_ms: 0
jitter_ms: 2000
